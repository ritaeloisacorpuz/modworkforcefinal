    <!-- Structural CSS Rules for Layout & Modular Bounds -->
    <style>
        /* Global Structural Defaults */
        p {
            text-align: justify;
            font-size: max(1.15rem, 100%);
        }
        
        h1, h2, h3, h4, h5, h6 {
            text-align: center;
        }

        img, video, svg {
            object-position: center;
            max-width: 100%;
            height: auto;
        }

        /* Enforce Minimum Font Floor across the Component */
        .site-header, .site-header * {
            font-size: max(1.15rem, 100%);
        }

        /* Desktop Header Layout & Positioning */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            margin: 0 0 1.5rem 0;
            width: 100%;
            box-sizing: border-box;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-decoration: none;
            line-height: 1.1;
        }

        .brand-logo .logo-main {
            font-size: max(1.8rem, 120%);
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .brand-logo .logo-sub {
            font-size: max(1.15rem, 100%);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Nav Menu Horizontal Layout (Desktop) */
        .nav-menu {
            display: flex;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 0;
        }

        .nav-menu li {
            display: flex;
            align-items: center;
            position: relative;
        }

        /* Vertical Divider Lines between desktop menu items */
        .nav-menu li:not(:last-child)::after {
            content: "";
            display: inline-block;
            height: 1.8rem;
            width: 1px;
            background-color: currentColor;
            opacity: 0.4;
            margin: 0 0.8rem;
        }

        .nav-menu a {
            text-decoration: none;
            padding: 0.5rem 0.2rem;
            white-space: nowrap;
            display: inline-block;
        }

        /* Compact Layout Overrides for Mobile Viewports */
        @media screen and (max-width: 768px) {
            .site-header {
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 0.75rem 0.5rem;
            }

            .brand-logo {
                text-align: center;
                margin-bottom: 0.75rem;
            }

            .nav-menu {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.4rem 0.6rem;
                width: 100%;
            }

            /* Hide vertical dividers on mobile grid to keep it compact */
            .nav-menu li:not(:last-child)::after {
                display: none;
            }

            .nav-menu li {
                margin: 0.1rem 0.2rem;
            }

            .nav-menu a {
                padding: 0.3rem 0.5rem;
                text-align: center;
            }
        }
    </style>
</head>

</body>
