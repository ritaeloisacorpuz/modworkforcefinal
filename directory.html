    <style>
        body, main, section, p, div, span, li, a {
            font-size: max(1rem, 100%);
            line-height: 1.5;
        }

        p {
            text-align: left;
            margin-bottom: 0.5rem;
        }

        h1, h2, h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .directory-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .directory-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .cleaners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .cleaner-card {
            background-color: #000;
            color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        .cleaner-photo {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .cleaner-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .cleaner-name {
            color: #fff;
            margin-bottom: 12px;
            font-size: 1.25rem;
            text-align: center;
        }

        .cleaner-meta {
            background-color: #ffffff;
            color: #000000;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .cleaner-meta p {
            color: #000;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .cleaner-narrative {
            color: #ddd;
            font-size: 0.95rem;
            margin-bottom: 15px;
            flex-grow: 1;
            text-align: left;
        }

        .btn-request {
            display: block;
            background-color: #fff;
            color: #000;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }

        .loading-msg {
            text-align: center;
            margin: 50px 0;
            font-weight: 600;
        }

        @media screen and (max-width: 768px) {
            .cleaners-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="directory-section">
    <div class="directory-header">
      <h1>Supplier Directory</h1>
      <p>Browse here to find the supplier you need for your small business.</p>
      <p>If you are a potential supplier, create your profile here to get new clients by clicking the button below.</p>
      <a href="input.html" class="btn-outline">Create your Supplier Profile in MOD Workforce</a>
    </div>

    <div id="loading" class="loading-msg">Loading profiles from database...</div>
    <div id="cleaners-container" class="cleaners-grid"></div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="include.js"></script>

<script>
const PUBLIC_R2_URL = "https://pub-717848f3e98b4114afb9b42dd2e0d2c5.r2.dev";

function fixImageUrl(rawUrl) {
  if (!rawUrl || typeof rawUrl !== 'string') return '';
  let url = rawUrl.trim();
  if (url.includes("r2.cloudflarestorage.com")) {
    const parts = url.split("/");
    const key = parts.slice(3).join("/");
    return `${PUBLIC_R2_URL}/${key}`;
  }
  return url;
}

document.addEventListener("DOMContentLoaded", async function () {
  const container = document.getElementById("cleaners-container");
  const loadingMsg = document.getElementById("loading");

  try {
    const response = await fetch("https://directory-api.rita-eloisa-corpuz.workers.dev");
    const suppliers = await response.json();

    if (loadingMsg) loadingMsg.style.display = "none";

    if (!suppliers || suppliers.length === 0) {
      container.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>No profiles found in database.</p>";
      return;
    }

    container.innerHTML = "";
    suppliers.forEach(cleaner => {
      const workerName = `${cleaner.first_name || ''} ${cleaner.last_name || ''}`.trim() || 'Anonymous Supplier';
      const workerEmail = cleaner.email || 'N/A';
      const workerPhone = cleaner.primary_phone || 'N/A';
      const workerNarrative = cleaner.description || 'No background description provided.';
      const photo = fixImageUrl(cleaner.profile_pic_url) || 'images/default-avatar.jpg';

      const cardHTML = `
        <div class="cleaner-card">
          <img src="${photo}" alt="${workerName}" class="cleaner-photo" onerror="this.onerror=null; this.src='https://via.placeholder.com/280x250/ffffff/000000?text=No+Photo';" />
          <div class="cleaner-info">
            <h3 class="cleaner-name">${workerName}</h3>
            <div class="cleaner-meta">
              <p><strong>Email:</strong> ${workerEmail}</p>
              <p><strong>Contact:</strong> ${workerPhone}</p>
            </div>
            <p class="cleaner-narrative">${workerNarrative}</p>
            <a href="mailto:${workerEmail}" class="btn-request">Contact Supplier</a>
          </div>
        </div>
      `;
      container.innerHTML += cardHTML;
    });
  } catch (err) {
    if (loadingMsg) {
      loadingMsg.innerText = "Failed to load profiles from database.";
    }
    console.error("Database Fetch Error:", err);
  }
});
</script>

</body>
</html>
